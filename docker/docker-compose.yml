version: "3.9"

# Compose reads env values from the project-root `.env` file (see .env.example).
# Nothing sensitive should be committed here — use env_file / ${VAR} substitution only.

services:

  # ─── PostgreSQL ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-kyro}
      POSTGRES_USER:     ${POSTGRES_USER:-kyro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kyro}"]
      interval: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  # ─── FastAPI Backend ─────────────────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8001:8000"
    env_file:
      - ../.env
    environment:
      # Only overrides / composed values live here — everything else comes from .env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kyro}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kyro}
      REDIS_HOST:   redis
      REDIS_PORT:   "6379"
      REDIS_URL:    redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app/backend
      - ../ai:/app/ai
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # ─── Vision Worker (CPU fallback — no GPU required for dev) ─────────────
  vision:
    build:
      context: ..
      dockerfile: docker/vision.Dockerfile
    env_file:
      - ../.env
    environment:
      DETECTION_DEVICE: ${DETECTION_DEVICE:-cpu}   # Change to "cuda" with GPU + nvidia-container-toolkit
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      BACKEND_URL: http://backend:8000
      CAMERA_ID:  ${CAMERA_ID:-cam-01}
      STREAM_SOURCE: ${STREAM_SOURCE:-/dev/video0}
    devices:
      # Passes the host's video device into the container. Linux hosts
      # only — Docker Desktop on macOS/Windows cannot pass through a USB
      # device like this; on those platforms, use an RTSP/network stream.
      - "/dev/video0:/dev/video0"
    depends_on:
      - redis
      - backend
    volumes:
      - ../ai:/app/ai
      - model_weights:/app/ai/models/weights

  # ─── Next.js Dashboard ───────────────────────────────────────────────────
  dashboard:
    build:
      context: ..
      dockerfile: dashboard/docker/dashboard.Dockerfile
      args:
        BACKEND_URL: http://backend:8000
        NEXT_PUBLIC_CAMERA_ID: ${CAMERA_ID:-cam-01}
        NEXT_PUBLIC_DEMO: "false"
    ports:
      - "3001:3000"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  model_weights:
