worker_processes 1;

events { worker_connections 1024; }

http {
    # Use Docker's internal DNS so service names always resolve correctly
    resolver 127.0.0.11 valid=10s ipv6=off;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    server {
        listen 80;
        server_name _;

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            set $backend_upstream http://backend:8000;
            proxy_pass         $backend_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            set $backend_upstream http://backend:8000;
            proxy_pass             $backend_upstream;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade    $http_upgrade;
            proxy_set_header       Connection "upgrade";
            proxy_set_header       Host       $host;
            proxy_read_timeout     3600s;
            proxy_send_timeout     3600s;
        }

        location /health {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream/health;
        }

        location /docs {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream/docs;
        }

        location /redoc {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream/redoc;
        }

        location /openapi.json {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream/openapi.json;
        }

        location / {
            set $dashboard_upstream http://dashboard:3000;
            proxy_pass         $dashboard_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
