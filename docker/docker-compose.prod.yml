version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Kyro — Production Compose
#
# Everything runs behind nginx on port 80 (one URL for everything).
# The dashboard talks to /api/ and /ws/ on the same origin — no hardcoded
# localhost — so it works on any domain, ngrok tunnel, or cloud host.
#
# Usage:
#   APP_URL=https://your-domain.com docker compose -f docker-compose.prod.yml up -d
#
# If APP_URL is not set, relative paths are used (works for same-host access).
# ─────────────────────────────────────────────────────────────────────────────

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       kyro
      POSTGRES_USER:     kyro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kyro-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyro"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL:         postgresql+asyncpg://kyro:${POSTGRES_PASSWORD:-kyro-change-me}@postgres:5432/kyro
      REDIS_HOST:           redis
      REDIS_PORT:           "6379"
      REDIS_URL:            redis://redis:6379/0
      KYRO_API_KEY:         ${KYRO_API_KEY:-change-me-api-key}
      KYRO_JWT_SECRET:      ${KYRO_JWT_SECRET:-change-me-jwt-secret}
      KYRO_DASHBOARD_USER:  ${KYRO_DASHBOARD_USER:-admin}
      KYRO_DASHBOARD_PASS:  ${KYRO_DASHBOARD_PASS:-change-me-password}
      VAPID_PUBLIC_KEY:     ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY:    ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT:        ${VAPID_SUBJECT:-mailto:admin@kyro.app}
      # Allow the nginx proxy origin
      ALLOWED_ORIGINS:      ${APP_URL:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: ..
      dockerfile: dashboard/docker/dashboard.Dockerfile
      args:
        # Same-origin — dashboard calls /api/ which nginx proxies to backend
        # Works for any domain without a rebuild
        NEXT_PUBLIC_API_URL:  ""
        NEXT_PUBLIC_WS_URL:   ""
        NEXT_PUBLIC_CAMERA_ID: cam-01
        NEXT_PUBLIC_DEMO:     "true"
        NEXT_PUBLIC_DEMO_USER: "kharis-tech"
        NEXT_PUBLIC_DEMO_PASS: "Kharis2024!"
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - dashboard

  vision:
    build:
      context: ..
      dockerfile: docker/vision.Dockerfile
    restart: unless-stopped
    environment:
      DETECTION_DEVICE: ${DETECTION_DEVICE:-cpu}
      REDIS_HOST:       redis
      REDIS_PORT:       "6379"
      BACKEND_URL:      http://backend:8000
    depends_on:
      - redis
      - backend
    volumes:
      - model_weights:/app/ai/models/weights

volumes:
  postgres_data:
  model_weights:
